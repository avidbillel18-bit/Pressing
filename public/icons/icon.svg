<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="drumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Washing Machine Body -->
  <g filter="url(#shadow)">
    <rect x="96" y="80" width="320" height="352" rx="40" fill="#ffffff" />
    
    <!-- Top Control Bar -->
    <rect x="96" y="80" width="320" height="70" rx="40" fill="#f1f5f9" />
    <rect x="96" y="120" width="320" height="30" fill="#f1f5f9" />
    
    <!-- Power & Status Lights -->
    <circle cx="140" cy="115" r="10" fill="#0f766e" />
    <circle cx="170" cy="115" r="7" fill="#f59e0b" />
    <circle cx="195" cy="115" r="7" fill="#10b981" />
    
    <!-- Display screen on machine -->
    <rect x="290" y="98" width="90" height="34" rx="8" fill="#0f172a" />
    <text x="335" y="122" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">0258</text>

    <!-- Round Door / Drum Outer Rim -->
    <circle cx="256" cy="275" r="115" fill="#e2e8f0" />
    <circle cx="256" cy="275" r="100" fill="url(#drumGrad)" />

    <!-- Glass reflections & water wave inside -->
    <path d="M 166 275 C 190 245, 230 245, 256 275 C 282 305, 322 305, 346 275 A 90 90 0 0 1 166 275 Z" fill="#ffffff" fill-opacity="0.35" />
    <circle cx="256" cy="275" r="60" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />
    
    <!-- Inner Sparkles -->
    <polygon points="256,230 262,246 278,252 262,258 256,274 250,258 234,252 250,246" fill="#fef08a" />
    
    <!-- Door Handle -->
    <rect x="345" y="260" width="16" height="30" rx="8" fill="#94a3b8" />
  </g>
</svg>
